<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" height="720" role="img" aria-labelledby="title desc">
  <title id="title">Четыре слоя одного учебного фрагмента: форма, смысл, рамка и проверка</title>
  <desc id="desc">Схема показывает, что образцы подачи задают форму, черновик задаёт неизменяемый смысл, ограничения задают проверяемую рамку, а запуск примера даёт свидетельство. Форма может меняться, смысл и ограничения — нет.</desc>

  <rect x="0" y="0" width="1100" height="720" fill="#fbfbf8"/>
  <text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#1f2937">Один фрагмент — четыре слоя проверки</text>
  <text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#4b5563">Учебная схема. Не снимок интерфейса OpenCode или Codex.</text>

  <!-- Layer 1: form -->
  <rect x="140" y="100" width="800" height="115" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="20" y="132" width="105" height="50" rx="10" fill="#2563eb"/>
  <text x="72" y="163" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff">ФОРМА</text>
  <text x="165" y="135" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1e3a8a">Образец 1: объяснение → действие</text>
  <text x="165" y="164" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1e3a8a">Образец 2: предсказание → проверка</text>
  <text x="165" y="193" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1e40af">Можно менять порядок и тон. Нельзя брать факты из образца.</text>

  <!-- Layer 2: meaning -->
  <rect x="140" y="235" width="800" height="115" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <rect x="20" y="267" width="105" height="50" rx="10" fill="#16a34a"/>
  <text x="72" y="298" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff">СМЫСЛ</text>
  <text x="165" y="270" font-family="Menlo, Consolas, monospace" font-size="19" font-weight="700" fill="#14532d">animal = "кот"</text>
  <text x="165" y="298" font-family="Menlo, Consolas, monospace" font-size="19" font-weight="700" fill="#14532d">print(animal)</text>
  <text x="165" y="326" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#166534">Вывод: кот</text>
  <rect x="640" y="258" width="270" height="70" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="775" y="285" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#14532d">Не менять:</text>
  <text x="775" y="308" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#14532d">имя, значение, вывод</text>

  <!-- Layer 3: constraints -->
  <rect x="140" y="370" width="800" height="115" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <rect x="20" y="402" width="105" height="50" rx="10" fill="#d97706"/>
  <text x="72" y="433" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff">РАМКА</text>
  <text x="165" y="405" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#78350f">≤ 120 слов без кода · 1 пример на версию</text>
  <text x="165" y="435" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#78350f">каждый термин объяснён · снимок только для чтения</text>
  <text x="165" y="463" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#92400e">Проверка: подсчёт слов, чтение терминов, сверка файлов.</text>

  <!-- Layer 4: evidence -->
  <rect x="140" y="505" width="800" height="115" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <rect x="20" y="537" width="105" height="50" rx="10" fill="#7c3aed"/>
  <text x="72" y="568" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff">ПРОВЕРКА</text>
  <text x="165" y="540" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#4c1d95">Предсказано: кот</text>
  <text x="165" y="568" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#4c1d95">Запущено: кот</text>
  <text x="165" y="596" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#4c1d95">Совпало: да → статус «да»</text>
  <circle cx="865" cy="562" r="30" fill="#22c55e"/>
  <path d="M 850 562 L 860 573 L 881 550" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="865" y="642" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4c1d95">без запуска — «нет данных»</text>

  <!-- Direction arrow -->
  <line x1="985" y1="120" x2="985" y2="600" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <text x="1005" y="360" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b7280" transform="rotate(90 1005 360)" text-anchor="middle">от замысла к свидетельству</text>

  <text x="30" y="670" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#374151">Образец задаёт форму. Смысл берётся из черновика. Рамка проверяется. Вывод подтверждается запуском.</text>
  <text x="30" y="696" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6b7280">Если слой пропущен, решение за вас принимает агент — и вы не сможете отличить правдоподобный текст от проверенного.</text>
</svg>
