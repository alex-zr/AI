<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="l08ChartTitle l08ChartDesc">
  <title id="l08ChartTitle">L08: Учебная диаграмма сопоставления исходных ответов, тайм-аута и ручной правки</title>
  <desc id="l08ChartDesc">Диаграмма показывает три сценария оценки четырёх попыток в L08: (1) когда B устраняет пропуск шага сверки, (2) когда и A, и B проходят все 3 критерия, потому что требование уже было в брифе, и (3) когда одна попытка завершается тайм-аутом (нет данных), а ручная правка фиксируется отдельно от исходного ответа.</desc>

  <rect width="1100" height="640" fill="#fbfbfd"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="42" font-size="24" font-weight="700" fill="#0f172a">Учебная диаграмма: три типовых сценария матрицы L08 и границы вывода</text>
    <text x="40" y="68" font-size="14" fill="#475569">Источник данных: условные учебные сценарии для разбора (не результаты реального запуска OpenCode или Codex).</text>

    <!-- Scenario 1 -->
    <rect x="40" y="95" width="320" height="420" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="200" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#0369a1">Сценарий 1: B даёт прирост</text>
    <text x="60" y="154" font-size="13" fill="#334155">В A пропущен шаг сверки или</text>
    <text x="60" y="172" font-size="13" fill="#334155">ожидаемый вывод; в B — все 3 «да».</text>

    <!-- Mini bars for Scenario 1 -->
    <text x="60" y="212" font-size="13" font-weight="700" fill="#1e293b">OpenCode A (1 из 3 «да»)</text>
    <rect x="60" y="222" width="80" height="18" rx="3" fill="#eab308"/>
    <text x="150" y="236" font-size="12" fill="#a16207">Корректность: да; Сверка: нет</text>

    <text x="60" y="268" font-size="13" font-weight="700" fill="#1e293b">OpenCode B (3 из 3 «да»)</text>
    <rect x="60" y="278" width="240" height="18" rx="3" fill="#22c55e"/>
    <text x="60" y="312" font-size="12" fill="#15803d">Все 3 признака подтверждены</text>

    <text x="60" y="348" font-size="13" font-weight="700" fill="#1e293b">Codex A (2 из 3 «да»)</text>
    <rect x="60" y="358" width="160" height="18" rx="3" fill="#eab308"/>

    <text x="60" y="404" font-size="13" font-weight="700" fill="#1e293b">Codex B (3 из 3 «да»)</text>
    <rect x="60" y="414" width="240" height="18" rx="3" fill="#22c55e"/>

    <rect x="56" y="450" width="288" height="50" rx="6" fill="#f0f9ff" stroke="#0284c7"/>
    <text x="68" y="470" font-size="12" font-weight="700" fill="#0369a1">Вывод по серии:</text>
    <text x="68" y="488" font-size="12" fill="#0f172a">Выбираем B (подтверждено в обеих средах).</text>

    <!-- Scenario 2 -->
    <rect x="390" y="95" width="320" height="420" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="550" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#15803d">Сценарий 2: Равный результат</text>
    <text x="410" y="154" font-size="13" fill="#334155">И A, и B набрали 3 из 3 «да», так как</text>
    <text x="410" y="172" font-size="13" fill="#334155">требование сверки уже есть в brief.md.</text>

    <text x="410" y="212" font-size="13" font-weight="700" fill="#1e293b">OpenCode A (3 из 3 «да»)</text>
    <rect x="410" y="222" width="240" height="18" rx="3" fill="#22c55e"/>

    <text x="410" y="268" font-size="13" font-weight="700" fill="#1e293b">OpenCode B (3 из 3 «да»)</text>
    <rect x="410" y="278" width="240" height="18" rx="3" fill="#22c55e"/>

    <text x="410" y="348" font-size="13" font-weight="700" fill="#1e293b">Codex A (3 из 3 «да»)</text>
    <rect x="410" y="358" width="240" height="18" rx="3" fill="#22c55e"/>

    <text x="410" y="404" font-size="13" font-weight="700" fill="#1e293b">Codex B (3 из 3 «да»)</text>
    <rect x="410" y="414" width="240" height="18" rx="3" fill="#22c55e"/>

    <rect x="406" y="450" width="288" height="50" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="418" y="470" font-size="12" font-weight="700" fill="#15803d">Вывод по серии:</text>
    <text x="418" y="488" font-size="12" fill="#0f172a">Равенство по рубрике; B явно страхует шаг.</text>

    <!-- Scenario 3 -->
    <rect x="740" y="95" width="320" height="420" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="900" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#b45309">Сценарий 3: Сбой и ручная правка</text>
    <text x="760" y="154" font-size="13" fill="#334155">Одна попытка — тайм-аут; в другой</text>
    <text x="760" y="172" font-size="13" fill="#334155">потребовалась ручная правка.</text>

    <text x="760" y="212" font-size="13" font-weight="700" fill="#1e293b">Исходный ответ (2 из 3 «да»)</text>
    <rect x="760" y="222" width="160" height="18" rx="3" fill="#f97316"/>
    <text x="760" y="255" font-size="12" fill="#c2410c">В матрицу идёт ИСХОДНЫЙ ответ!</text>

    <text x="760" y="290" font-size="13" font-weight="700" fill="#1e293b">После ручной правки (3 из 3)</text>
    <rect x="760" y="300" width="240" height="18" rx="3" fill="#38bdf8"/>
    <text x="760" y="333" font-size="12" fill="#0369a1">Хранится отдельно (не заслуга промпта)</text>

    <text x="760" y="370" font-size="13" font-weight="700" fill="#991b1b">Попытка с тайм-аутом (8 мин)</text>
    <rect x="760" y="380" width="240" height="18" rx="3" fill="#cbd5e1"/>
    <text x="760" y="413" font-size="12" font-weight="700" fill="#475569">В ячейках: «нет данных» (не «нет» и не «да»)</text>

    <rect x="756" y="450" width="288" height="50" rx="6" fill="#fffbeb" stroke="#d97706"/>
    <text x="768" y="470" font-size="12" font-weight="700" fill="#b45309">Вывод по серии:</text>
    <text x="768" y="488" font-size="12" fill="#78350f">Вывод ограничен доступными попытками.</text>

    <!-- Footer rule -->
    <rect x="40" y="535" width="1020" height="75" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="60" y="564" font-size="15" font-weight="700" fill="#991b1b">Главное правило честной оценки L08:</text>
    <text x="60" y="588" font-size="14" fill="#7f1d1d">Никогда не записывайте ручную правку человека как исходный успех промпта в матрице 2 × 2. Исходный ответ и ручная доводка оцениваются раздельно.</text>
  </g>
</svg>
