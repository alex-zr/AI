specification: SPEC-CORE-PY-001
python_version: '3.14'
status: полная предложенная структура S01–S07; ожидает утверждения и оценки плановых минут
stages:
- id: S01
  title: 'Beginner: основы программирования'
  status: предварительный
  modules:
  - id: S01-M01
    title: Программа и среда
    topics:
    - id: S01-M01-T001
      title: Программы и исполнение
      subtopics:
      - id: S01-M01-T001-P01
        title: Что делает программа
        concepts:
        - команда
        - данные
        - алгоритм
        - последовательность шагов
        - результат
        learning_outcomes:
        - Описывать алгоритм словами и отличать входные данные от результата
        depth: базовая
        interview_priority: средний
        prerequisites: []
        estimated_theory_questions: 3
        cpython_internals: false
        interview_traps:
        - Смешение текста программы и результата исполнения
        mandatory_revisit:
          target_concept: функции и разбор решения
          target_id: S03-M12
          status: обязательно; тематические повторения уточняются
      - id: S01-M01-T001-P02
        title: Python и интерпретатор
        concepts:
        - язык Python
        - реализация CPython
        - версия 3.14
        - интерактивный режим
        - файл программы
        learning_outcomes:
        - Различать язык и реализацию, выбирать режим запуска и фиксировать версию
        depth: базовая
        interview_priority: средний
        prerequisites: []
        estimated_theory_questions: 3
        cpython_internals: true
        interview_traps:
        - Результат одного запуска принимается за гарантию языка
        mandatory_revisit:
          target_concept: механизмы CPython
          target_id: S06-M23
          status: обязательно; тематические повторения уточняются
    - id: S01-M01-T002
      title: Запуск и обратная связь
      subtopics:
      - id: S01-M01-T002-P01
        title: Рабочая среда
        concepts:
        - терминал
        - текущий каталог
        - файл .py
        - команда запуска
        - стандартный вывод
        learning_outcomes:
        - Создавать и запускать файл, определять каталог и видеть результат
        depth: применение
        interview_priority: низкий
        prerequisites:
        - S01-M01-T001-P02
        estimated_theory_questions: 3
        cpython_internals: false
        interview_traps:
        - Команда терминала смешивается с кодом Python
        mandatory_revisit:
          target_concept: организация проекта
          target_id: S04-M16
          status: обязательно; тематические повторения уточняются
      - id: S01-M01-T002-P02
        title: Ошибки и диагностика
        concepts:
        - синтаксическая ошибка
        - ошибка выполнения
        - traceback
        - строка и место ошибки
        learning_outcomes:
        - Находить место сбоя и различать основные классы ошибок без изучения иерархии исключений
        depth: применение
        interview_priority: высокий
        prerequisites:
        - S01-M01-T002-P01
        estimated_theory_questions: 3
        cpython_internals: false
        interview_traps:
        - Последняя строка traceback игнорируется
        mandatory_revisit:
          target_concept: исключения и работа с файлами
          target_id: S04-M15
          status: обязательно; тематические повторения уточняются
  - id: S01-M02
    title: Значения и выражения
    topics:
    - id: S01-M02-T003
      title: Синтаксис и имена
      subtopics:
      - id: S01-M02-T003-P01
        title: Исходный текст
        concepts:
        - инструкция
        - выражение
        - строка
        - отступ
        - комментарий
        - регистр символов
        learning_outcomes:
        - Распознавать основные элементы записи и корректно оформлять простой код
        depth: применение
        interview_priority: средний
        prerequisites:
        - S01-M01-T002-P01
        estimated_theory_questions: 3
        cpython_internals: false
        interview_traps:
        - Отступ считается только оформлением
        mandatory_revisit:
          target_concept: функции и разбор решения
          target_id: S03-M12
          status: обязательно; тематические повторения уточняются
      - id: S01-M02-T003-P02
        title: Имена и присваивание
        concepts:
        - идентификатор
        - ключевое слово
        - оператор =
        - связывание имени
        - повторное присваивание
        learning_outcomes:
        - Выбирать допустимые имена и отслеживать текущие значения имён
        depth: применение
        interview_priority: высокий
        prerequisites:
        - S01-M02-T003-P01
        estimated_theory_questions: 3
        cpython_internals: true
        interview_traps:
        - Присваивание считают математическим равенством
        mandatory_revisit:
          target_concept: объекты и ссылки
          target_id: S02-M05
          status: обязательно; тематические повторения уточняются
    - id: S01-M02-T004
      title: Числа и вычисления
      subtopics:
      - id: S01-M02-T004-P01
        title: Целые и вещественные числа
        concepts:
        - int
        - float
        - литерал
        - знак
        - преобразование типов
        - пределы точности float
        learning_outcomes:
        - Различать числовые типы и выбирать допустимое преобразование
        depth: применение
        interview_priority: высокий
        prerequisites:
        - S01-M02-T003-P02
        estimated_theory_questions: 3
        cpython_internals: false
        interview_traps:
        - Десятичная запись float всегда точна
        mandatory_revisit:
          target_concept: числа и стандартная библиотека
          target_id: S06-M22
          status: обязательно; тематические повторения уточняются
      - id: S01-M02-T004-P02
        title: Операторы и порядок
        concepts:
        - +
        - '-'
        - '*'
        - /
        - //
        - '%'
        - '**'
        - скобки
        - приоритет
        - деление на ноль
        learning_outcomes:
        - Вычислять результат выражения и объяснять порядок операций
        depth: применение
        interview_priority: высокий
        prerequisites:
        - S01-M02-T004-P01
        estimated_theory_questions: 3
        cpython_internals: false
        interview_traps:
        - Округление деления // принимается за усечение к нулю
        mandatory_revisit:
          target_concept: числа и стандартная библиотека
          target_id: S06-M22
          status: обязательно; тематические повторения уточняются
    - id: S01-M02-T005
      title: Строки и ввод-вывод
      subtopics:
      - id: S01-M02-T005-P01
        title: Строковые значения
        concepts:
        - str
        - литерал
        - кавычки
        - экранирование
        - конкатенация
        - длина
        - неизменяемость на уровне наблюдений
        learning_outcomes:
        - Создавать строки и выполнять базовые операции
        depth: применение
        interview_priority: средний
        prerequisites:
        - S01-M02-T003-P02
        estimated_theory_questions: 3
        cpython_internals: false
        interview_traps:
        - Смешение числа и его строкового представления
        mandatory_revisit:
          target_concept: строки и последовательности
          target_id: S02-M06
          status: обязательно; тематические повторения уточняются
      - id: S01-M02-T005-P02
        title: Ввод и форматированный вывод
        concepts:
        - input
        - print
        - преобразование ввода
        - f-строка
        - разделители и завершение вывода
        learning_outcomes:
        - Получать вход, преобразовывать его и выводить понятный результат
        depth: применение
        interview_priority: средний
        prerequisites:
        - S01-M02-T004-P01
        - S01-M02-T005-P01
        estimated_theory_questions: 3
        cpython_internals: false
        interview_traps:
        - input возвращает число автоматически
        mandatory_revisit:
          target_concept: исключения и работа с файлами
          target_id: S04-M15
          status: обязательно; тематические повторения уточняются
  - id: S01-M03
    title: Условия и циклы
    topics:
    - id: S01-M03-T006
      title: Логические выражения
      subtopics:
      - id: S01-M03-T006-P01
        title: Сравнения
        concepts:
        - bool
        - 'True'
        - 'False'
        - ==
        - '!='
        - <
        - <=
        - '>'
        - '>='
        - цепочки сравнений
        learning_outcomes:
        - Сравнивать значения и объяснять результат и цепочки сравнений
        depth: применение
        interview_priority: высокий
        prerequisites:
        - S01-M02-T004-P02
        - S01-M02-T005-P01
        estimated_theory_questions: 3
        cpython_internals: false
        interview_traps:
        - Оператор = путают с ==
        mandatory_revisit:
          target_concept: объекты и ссылки
          target_id: S02-M05
          status: обязательно; тематические повторения уточняются
      - id: S01-M03-T006-P02
        title: Логические операции
        concepts:
        - and
        - or
        - not
        - приоритет
        - истинность
        - короткое замыкание
        learning_outcomes:
        - Составлять и пошагово вычислять логические условия
        depth: понимание механизма
        interview_priority: высокий
        prerequisites:
        - S01-M03-T006-P01
        estimated_theory_questions: 3
        cpython_internals: false
        interview_traps:
        - and и or всегда возвращают bool
        mandatory_revisit:
          target_concept: объекты и ссылки
          target_id: S02-M05
          status: обязательно; тематические повторения уточняются
    - id: S01-M03-T007
      title: Ветвление
      subtopics:
      - id: S01-M03-T007-P01
        title: Условная инструкция
        concepts:
        - if
        - elif
        - else
        - блок
        - вложенность
        - порядок ветвей
        learning_outcomes:
        - Реализовывать выбор и прослеживать исполнение ветвей
        depth: применение
        interview_priority: высокий
        prerequisites:
        - S01-M02-T003-P01
        - S01-M03-T006-P02
        estimated_theory_questions: 3
        cpython_internals: false
        interview_traps:
        - Несколько независимых if считают эквивалентом цепочки elif
        mandatory_revisit:
          target_concept: объектно-ориентированное программирование
          target_id: S05-M18
          status: обязательно; тематические повторения уточняются
      - id: S01-M03-T007-P02
        title: Пограничные условия
        concepts:
        - диапазон
        - включительная и исключительная граница
        - порядок проверок
        - пустой ввод
        learning_outcomes:
        - Выбирать проверки границ и находить пропущенные случаи
        depth: применение
        interview_priority: высокий
        prerequisites:
        - S01-M03-T007-P01
        estimated_theory_questions: 3
        cpython_internals: false
        interview_traps:
        - Границу проверяют только с одной стороны
        mandatory_revisit:
          target_concept: тестирование и анализ решений
          target_id: S07-M24
          status: обязательно; тематические повторения уточняются
    - id: S01-M03-T008
      title: Повторение действий
      subtopics:
      - id: S01-M03-T008-P01
        title: Цикл while
        concepts:
        - условие продолжения
        - тело
        - изменение состояния
        - завершение
        - бесконечный цикл
        learning_outcomes:
        - Строить завершающийся цикл и прослеживать его состояние
        depth: применение
        interview_priority: высокий
        prerequisites:
        - S01-M03-T007-P01
        estimated_theory_questions: 3
        cpython_internals: false
        interview_traps:
        - Условие или состояние цикла не меняется
        mandatory_revisit:
          target_concept: тестирование и анализ решений
          target_id: S07-M24
          status: обязательно; тематические повторения уточняются
      - id: S01-M03-T008-P02
        title: Цикл for и range
        concepts:
        - for
        - последовательность значений
        - range
        - старт
        - шаг
        - исключённая верхняя граница
        learning_outcomes:
        - Применять range и предсказывать число итераций без объяснения протокола итераторов
        depth: применение
        interview_priority: высокий
        prerequisites:
        - S01-M03-T008-P01
        estimated_theory_questions: 3
        cpython_internals: false
        interview_traps:
        - Верхняя граница range включена
        mandatory_revisit:
          target_concept: итерация и протоколы
          target_id: S06-M20
          status: обязательно; тематические повторения уточняются
      - id: S01-M03-T008-P03
        title: Управление циклом
        concepts:
        - break
        - continue
        - вложенные циклы
        - область действия команд
        learning_outcomes:
        - Управлять проходами и объяснять выход из вложенных циклов
        depth: применение
        interview_priority: высокий
        prerequisites:
        - S01-M03-T008-P02
        estimated_theory_questions: 3
        cpython_internals: false
        interview_traps:
        - break завершает все вложенные циклы
        mandatory_revisit:
          target_concept: итерация и протоколы
          target_id: S06-M20
          status: обязательно; тематические повторения уточняются
  - id: S01-M04
    title: Функции и базовый разбор задач
    topics:
    - id: S01-M04-T009
      title: Создание функций
      subtopics:
      - id: S01-M04-T009-P01
