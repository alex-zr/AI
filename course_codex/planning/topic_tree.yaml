          target_concept: функции и области видимости
          target_id: S03-M13
          status: обязательно; тематические повторения уточняются
      - id: S01-M04-T010-P02
        title: Проверка решения
        concepts:
        - условие
        - вход и выход
        - предположение
        - пример
        - граница
        - проверка результата
        - ошибка
