        - return
        - завершение функции
        - неявный None
        - различие вывода и возврата
        learning_outcomes:
        - Проектировать простые функции и использовать возвращаемое значение
        depth: применение
        interview_priority: высокий
        prerequisites:
        - S01-M04-T009-P01
        estimated_theory_questions: 3
        cpython_internals: false
        interview_traps:
        - print считают возвратом результата
        mandatory_revisit:
          target_concept: функции и области видимости
          target_id: S03-M13
          status: обязательно; тематические повторения уточняются
    - id: S01-M04-T010
      title: Состояние и разбор решения
      subtopics:
      - id: S01-M04-T010-P01
        title: Локальные имена
        concepts:
        - локальное имя
        - параметр как имя
        - время жизни вызова
        - доступ к имени
        learning_outcomes:
